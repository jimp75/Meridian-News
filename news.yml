name: Actualiser les flux

on:
  schedule:
    - cron: '*/20 * * * *'   # toutes les 20 minutes
  workflow_dispatch:          # bouton « Run workflow »
  push:
    paths: ['scripts/fetch-feeds.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-feeds.mjs
      - name: Publier news.json
        run: |
          git config user.name  "meridian-bot"
          git config user.email "meridian-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Mise à jour des flux" && git push)
